[project]
name = "flowptr-client"
version = "0.1.0"
description = "httpx client for FlowPTR REST API"
readme = "README.md"
requires-python = "==3.9.*"
dependencies = [
    "authlib>=1.3.2",
    "httpx>=0.28.0",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "rich>=13.9.4",
]

# Define where the package is located
[tool.hatch.build.targets.wheel]
packages = ["src/flowptr_client"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "bpython>=0.24",
    "pytest-asyncio>=0.25.0",
    "pytest-env>=1.1.5",
    "pytest-httpx>=0.35.0",
    "pytest>=8.3.4",
    "respx>=0.21.1",
    "ruff>=0.8.3",
]

[tool.ruff]
include = ["src/flowptr_client/**/*.py"]
target-version = "py39"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

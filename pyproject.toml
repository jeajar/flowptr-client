[project]
name = "shotgrid-restapi-adapter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.9.*"
dependencies = [
    "authlib>=1.3.2",
    "httpx>=0.28.0",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "rich>=13.9.4",
]

[tool.uv]
dev-dependencies = [
    "bpython>=0.24",
    "pytest-asyncio>=0.25.0",
    "pytest-env>=1.1.5",
    "pytest-httpx>=0.35.0",
    "pytest>=8.3.4",
    "respx>=0.21.1",
    "ruff>=0.8.3",
]
[tool.ruff]
target-version = "py39"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]
